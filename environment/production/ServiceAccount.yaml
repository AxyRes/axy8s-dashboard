apiVersion: v1
kind: ServiceAccount
metadata:
  name: axy8s-admin-sa
  namespace: axy8s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: axy8s-admin-sa-cluster-admin
subjects:
  - kind: ServiceAccount
    name: axy8s-admin-sa
    namespace: axy8s
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io