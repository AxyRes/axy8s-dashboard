<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AXY8S Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link th:href="@{/ui/app.css}" rel="stylesheet">
</head>
<body class="app-dark">
<section class="full-screen centered">
    <div class="login-card">
        <div class="login-title">
            <span class="brand-dot"></span>
            <span>AXY8S Console</span>
        </div>
        <p class="login-subtitle">
            Đăng nhập để quản lý cluster. Nhớ là lab thôi, đừng đem ra production.
        </p>

        <form id="login-form">
            <label class="field-label">Tên người dùng</label>
            <input id="login-username" class="text-input" type="text" autocomplete="username" required>

            <label class="field-label">Mật khẩu</label>
            <input id="login-password" class="text-input" type="password" autocomplete="current-password" required>

            <button type="submit" class="btn primary-btn">Đăng nhập</button>

            <div id="login-error" class="error-text" hidden></div>
        </form>
    </div>
</section>

<script src="/ui/common.js"></script>
<script src="/ui/login.js"></script>
</body>
</html>
