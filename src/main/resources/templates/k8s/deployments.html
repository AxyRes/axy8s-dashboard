<div th:replace="~{layout :: layout(~{::content})}">
    <div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div>
            <p class="text-muted mb-1">Workloads</p>
            <h2 class="mb-0">Deployments</h2>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-secondary"><i class="bi bi-repeat me-2"></i>Restart</button>
            <button class="btn btn-primary"><i class="bi bi-plus-lg me-2"></i>Create</button>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-3" th:each="entry : ${workloadStatus}">
            <div class="status-card d-flex align-items-center gap-3">
                <div class="status-bullet text-success">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <div>
                    <div class="text-muted small" th:text="${entry.value.label}"></div>
                    <div class="fw-semibold" th:text="${entry.value.ready} + '/' + ${entry.value.total}"></div>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="status-card d-flex align-items-center gap-3">
                <div class="status-bullet text-success">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <div>
                    <div class="text-muted small" th:text="${statefulSets.label}"></div>
                    <div class="fw-semibold" th:text="${statefulSets.ready} + '/' + ${statefulSets.total}"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-ui-checks-grid text-primary"></i>
                <span class="fw-semibold">Deployments</span>
                <span class="badge text-bg-secondary" th:text="${deployments.size()}"></span>
            </div>
            <div class="d-flex gap-2 align-items-center">
                <div class="text-muted small">Namespace:</div>
                <select class="form-select form-select-sm" onchange="location=this.value;">
                    <option th:each="ns : ${namespaces}"
                            th:selected="${ns.metadata.name} == ${selectedNamespace}"
                            th:value="@{'/k8s/ns/' + ${ns.metadata.name} + '/apps~v1~Deployment'}"
                            th:text="${ns.metadata.name}">
                    </option>
                </select>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>Name</th>
                        <th>Namespace</th>
                        <th>Images</th>
                        <th>Labels</th>
                        <th>Pods</th>
                        <th>Age</th>
                        <th>Conditions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(deployments)}">
                        <td colspan="7" class="text-center text-muted py-4">No deployments found for this namespace.</td>
                    </tr>
                    <tr th:each="deployment : ${deployments}">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-stack text-primary"></i>
                                <span th:text="${deployment.metadata.name}"></span>
                            </div>
                        </td>
                        <td th:text="${deployment.metadata.namespace}"></td>
                        <td>
                            <div class="d-flex flex-wrap gap-1">
                                <span class="badge bg-light text-dark border"
                                      th:each="container : ${deployment.spec.template.spec.containers}"
                                      th:text="${container.image}"></span>
                            </div>
                        </td>
                        <td>
                            <div class="d-flex flex-wrap gap-1">
                                <span class="badge bg-light text-dark border"
                                      th:each="label : ${deployment.metadata.labels}" th:text="${label.key} + '=' + ${label.value}"></span>
                            </div>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <span th:text="${deployment.status.readyReplicas != null ? deployment.status.readyReplicas : 0}"></span>
                                <span class="text-muted">/</span>
                                <span th:text="${deployment.status.replicas != null ? deployment.status.replicas : 0}"></span>
                            </div>
                        </td>
                        <td>
                            <span class="badge text-bg-light">Just now</span>
                        </td>
                        <td>
                            <div class="d-flex flex-wrap gap-1">
                                <span class="badge bg-success-subtle text-success border border-success-subtle">Available</span>
                                <span class="badge bg-primary-subtle text-primary border border-primary-subtle">Progressing</span>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
