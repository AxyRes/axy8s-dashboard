<div th:replace="~{layout :: layout(~{::content})}">
    <div class="page-header d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div>
            <p class="text-muted mb-1">Namespace: <span th:text="${selectedNamespace}"></span></p>
            <h2 class="mb-0" th:text="${pageTitle}"></h2>
        </div>
        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-secondary" th:href="@{'/k8s/' + ${selectedNamespace} + '/' + ${selectedResource}}">
                <i class="bi bi-arrow-repeat me-2"></i>Refresh
            </a>
            <a class="btn btn-primary" href="#"><i class="bi bi-plus-lg me-2"></i>Create</a>
        </div>
    </div>

    <div class="row g-3 mt-1">
        <div class="col-md-3" th:each="entry : ${summary}">
            <div class="status-card d-flex align-items-center gap-3">
                <div class="status-bullet text-success">
                    <i class="bi bi-check-circle-fill"></i>
                </div>
                <div>
                    <div class="text-muted small" th:text="${entry.value.label}"></div>
                    <div class="fw-semibold" th:text="${entry.value.ready} + '/' + ${entry.value.total}"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="card mt-4">
        <div class="card-header d-flex flex-wrap align-items-center justify-content-between gap-2">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-ui-checks-grid text-primary"></i>
                <span class="fw-semibold" th:text="${pageTitle}"></span>
                <span class="badge text-bg-secondary" th:text="${#lists.size(tableRows)}"></span>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th th:each="col : ${tableColumns}" th:text="${col.label}"></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(tableRows)}">
                        <td th:colspan="${#lists.size(tableColumns)}" class="text-center text-muted py-4">No data found.</td>
                    </tr>
                    <tr th:each="row : ${tableRows}">
                        <td>
                            <div class="d-flex align-items-center gap-2">
                                <i class="bi bi-stack text-primary"></i>
                                <a th:if="${row.href}" th:href="${row.href}" class="link-underline link-underline-opacity-0 fw-semibold">
                                    <span th:text="${row.name}"></span>
                                </a>
                                <span th:if="${row.href == null}" th:text="${row.name}"></span>
                            </div>
                        </td>
                        <td th:if="${#lists.size(tableColumns)} >= 5" th:text="${row.namespace}"></td>
                        <td th:text="${row.status}"></td>
                        <td th:text="${row.details}"></td>
                        <td th:text="${row.age}"></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
