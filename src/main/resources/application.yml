server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:axy8sdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driverClassName: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  security:
    jwt-secret: "change-this-to-a-very-long-random-secret-for-real-env"
    jwt-expiration-minutes: 120
