spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        # Vẫn để dialect Postgres, H2 MODE=PostgreSQL chơi được
        dialect: org.hibernate.dialect.PostgreSQLDialect
